<!doctype html>
<!-- Launcher icon foreground (?px=size): the W of the desktop icon (build/appicon.png),
     lifted off its white tile onto a transparent 108dp adaptive-icon layer; the tile
     is the layer below (ic_launcher.xml). The W stays inside the 66dp safe zone.
     It's the monochrome (themed) layer too. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
<canvas id="art"></canvas>
<script type="module">
  const px = Number(new URLSearchParams(location.search).get("px") || 432);
  const img = new Image();
  img.src = "../../build/appicon.png";
  await img.decode();

  // The glyph: dark ink on the white tile. Its alpha is how dark each pixel is.
  const src = document.createElement("canvas");
  src.width = img.width; src.height = img.height;
  const sctx = src.getContext("2d");
  sctx.drawImage(img, 0, 0);
  const d = sctx.getImageData(0, 0, src.width, src.height);
  const INK = 0x21;
  let x0 = src.width, y0 = src.height, x1 = 0, y1 = 0;
  for (let y = 0; y < src.height; y++) {
    for (let x = 0; x < src.width; x++) {
      const i = (y * src.width + x) * 4;
      const lum = Math.min(d.data[i], d.data[i + 1], d.data[i + 2]);
      // Only the tile's opaque inside: its edge and drop shadow are grey too.
      const a = d.data[i + 3] === 255 ? Math.max(0, Math.min(1, (255 - lum) / (255 - INK))) : 0;
      d.data[i] = d.data[i + 1] = d.data[i + 2] = INK;
      d.data[i + 3] = Math.round(a * 255);
      if (a > 0.5) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    }
  }
  sctx.putImageData(d, 0, 0);

  // Shadows and the tile's rounded edge sit far from the glyph: keep the glyph's box only.
  const pad = 4;
  const gw = x1 - x0 + 1 + pad * 2, gh = y1 - y0 + 1 + pad * 2;
  const h = px * 0.40, w = h * gw / gh;
  const c = document.getElementById("art"), ctx = c.getContext("2d");
  c.width = c.height = px;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, x0 - pad, y0 - pad, gw, gh, (px - w) / 2, (px - h) / 2, w, h);
  document.body.dataset.ready = "1";
</script>
