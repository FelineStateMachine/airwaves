<!doctype html>
<!-- Wide capsule / header, 920x430. -->
<meta charset="utf-8">
<link rel="stylesheet" href="art.css">
<style>
  #art { width: 920px; height: 430px; }
  #art::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(40% 60% at 78% 55%, rgba(255, 178, 36, .07), transparent 70%);
  }
  .copy { position: absolute; left: 54px; top: 50%; transform: translateY(-50%); z-index: 2; }
  .mark { font-size: 136px; }
  .tag { font-size: 15px; margin-top: 26px; }
  .guide {
    left: 600px; right: 0; top: 0; bottom: 0;
    -webkit-mask-image:
      linear-gradient(to right, transparent, #000 12%),
      linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
</style>
<div class="art grain" id="art">
  <div class="guide" id="g"></div>
  <div class="copy">
    <div class="mark">Airwaves</div>
    <div class="tag">Live TV and guide</div>
  </div>
</div>
<script type="module">
  import { guide, ready } from "./art.js";
  await ready();
  guide(document.getElementById("g"), { u: 1.1, chw: 80, slot: 110, now: 1.1, first: 0, cur: 3, sel: false, seed: 5 });
  document.body.dataset.ready = "1";
</script>
